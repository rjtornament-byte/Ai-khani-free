<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Story Generator</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .card {
            background: #16213e;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            color: #e94560;
            margin-bottom: 20px;
        }
        textarea, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
            font-size: 14px;
            box-sizing: border-box;
        }
        textarea {
            height: 100px;
            background: #0f3460;
            color: #fff;
            resize: none;
        }
        select {
            background: #0f3460;
            color: #fff;
        }
        button {
            background-color: #e94560;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        #result {
            margin-top: 15px;
            background: #0f3460;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            display: none;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>✨ AI Story Maker</h2>
    <textarea id="idea" placeholder="Kahani ka idea yahan likhein..."></textarea>
    <select id="style">
        <option value="3D">3D Animation</option>
        <option value="Anime">Anime Style</option>
    </select>
    <button onclick="makeStory()">Video Banayein</button>
    <div id="result"></div>
</div>

<script>
    function makeStory() {
        let idea = document.getElementById('idea').value;
        let resultDiv = document.getElementById('result');
        
        if(idea.trim() === "") {
            alert("Pehle kuch toh likhein!");
            return;
        }

        resultDiv.style.display = "block";
        resultDiv.innerHTML = "<b>AI Story:</b><br>Aapke idea '" + idea + "' par adharit shandar kahani taiyar ho rahi hai! Jaldi hi yahan naya video scene aayega.";
    }
</script>

</body>
</html>
